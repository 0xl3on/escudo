# Add this to YOUR .gitlab-ci.yml to run escudo on every push.
supply-chain:
  stage: test
  image: rust:latest
  cache:
    - key: cargo-$CI_COMMIT_REF_SLUG
      paths:
        - $CARGO_HOME/registry
        - target/
    - key: escudo-freshness
      paths:
        - /tmp/escudo-cache
  variables:
    ESCUDO_CACHE_DIR: /tmp/escudo-cache
    CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
    CARGO_TERM_COLOR: always
  script:
    - cargo install escudo@0.1.1 --locked
    - escudo --no-color
