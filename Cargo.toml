[package]
name = "escudo"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
authors = ["0xl3on"]
description = "Lightweight supply chain security checker for Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0xl3on/escudo"
keywords = ["security", "supply-chain", "audit", "dependencies"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"
exclude = ["target/", ".github/"]

[[bin]]
name = "escudo"
path = "src/main.rs"

[lib]
name = "escudo"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
cargo_metadata = "0.19"
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
dirs = "6"
handlebars = "6"
thiserror = "2"
